<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Summary Assistant</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f3f4f6; margin:0; }
      .container { max-width:900px; margin:24px auto; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.08); }
      .header { display:flex; align-items:center; gap:12px }
      .logo { width:44px; height:44px; background:#2563eb; color:white; display:flex; align-items:center; justify-content:center; border-radius:8px; font-weight:700 }
      .muted { color:#6b7280 }
      .btn { background:#2563eb; color:white; padding:8px 12px; border-radius:6px; border:none; cursor:pointer }
      textarea { width:100%; min-height:120px; }
      .card { background:#fff; padding:12px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.04); margin-top:12px }
      .chip { display:inline-block; padding:6px 8px; background:#eef2ff; color:#3730a3; border-radius:999px; margin:4px 4px 0 0 }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">DS</div>
        <div>
          <h1 style="margin:0">Document Summary Assistant</h1>
          <div class="muted">Upload a document, extract text, and generate a summary.</div>
        </div>
      </div>

      <section style="margin-top:18px">
        <h2>Quick Test UI</h2>
        <p class="muted">Barebone, fully functional frontend for testing the backend APIs.</p>

        <div style="margin-top:10px">
          <input id="fileInput" type="file" accept="application/pdf,image/png,image/jpeg" />
          <button id="uploadBtn" class="btn">Upload</button>
          <button id="removeBtn" class="btn" style="background:#ef4444; margin-left:8px">Remove</button>
          <div id="uploadStatus" style="margin-top:8px;color:#374151"></div>
        </div>

        <div class="card">
          <div style="display:flex;gap:8px;align-items:center">
            <label for="filenameInput">Uploaded filename:</label>
            <input id="filenameInput" style="flex:1" readonly />
            <button id="processBtn" class="btn" style="margin-left:8px">Extract Text</button>
          </div>

          <div style="margin-top:10px">
            <label for="extractedText">Extracted text:</label>
            <textarea id="extractedText" readonly></textarea>
          </div>

          <div style="margin-top:10px; display:flex; gap:8px; align-items:center">
            <label for="summaryLength">Summary length:</label>
            <select id="summaryLength">
              <option value="short">Short</option>
              <option value="medium">Medium</option>
              <option value="long">Long</option>
            </select>
            <button id="summarizeBtn" class="btn">Generate Summary</button>
          </div>

          <div id="resultArea" style="margin-top:12px"></div>
        </div>

      </section>
    </div>

    <script>
      const uploadBtn = document.getElementById('uploadBtn');
      const removeBtn = document.getElementById('removeBtn');
      const fileInput = document.getElementById('fileInput');
      const uploadStatus = document.getElementById('uploadStatus');
      const filenameInput = document.getElementById('filenameInput');
      const processBtn = document.getElementById('processBtn');
      const extractedTextArea = document.getElementById('extractedText');
      const summarizeBtn = document.getElementById('summarizeBtn');
      const summaryLength = document.getElementById('summaryLength');
      const resultArea = document.getElementById('resultArea');

      let uploadedFilename = null;

      uploadBtn.addEventListener('click', async () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) { uploadStatus.textContent = 'Select a file first.'; return }
        uploadStatus.textContent = 'Uploading...';
        const fd = new FormData(); fd.append('file', f);
        try {
          const res = await fetch('http://localhost:8000/api/upload', { method: 'POST', body: fd });
          if (!res.ok) { uploadStatus.textContent = 'Upload failed: ' + await res.text(); return }
          const j = await res.json();
          uploadedFilename = j.filename;
          filenameInput.value = uploadedFilename;
          uploadStatus.textContent = 'Uploaded: ' + uploadedFilename;
          extractedTextArea.value = '';
          resultArea.innerHTML = '';
        } catch (e) { uploadStatus.textContent = 'Upload failed: ' + e }
      });

      removeBtn.addEventListener('click', () => {
        uploadedFilename = null; filenameInput.value = ''; extractedTextArea.value = ''; resultArea.innerHTML = ''; uploadStatus.textContent = 'Cleared.';
      });

      processBtn.addEventListener('click', async () => {
        if (!uploadedFilename) { uploadStatus.textContent = 'No uploaded file.'; return }
        uploadStatus.textContent = 'Processing...';
        const fd = new FormData(); fd.append('filename', uploadedFilename);
        try {
          const res = await fetch('http://localhost:8000/api/process', { method: 'POST', body: fd });
          if (!res.ok) { const txt = await res.text(); uploadStatus.textContent = 'Processing failed: ' + txt; return }
          const j = await res.json();
          extractedTextArea.value = j.text || '';
          uploadStatus.textContent = 'Text extracted.';
        } catch (e) { uploadStatus.textContent = 'Processing failed: ' + e }
      });

      summarizeBtn.addEventListener('click', async () => {
        const text = extractedTextArea.value;
        if (!text) { uploadStatus.textContent = 'No extracted text to summarize.'; return }
        uploadStatus.textContent = 'Summarizing...';
        const fd = new FormData(); fd.append('text', text); fd.append('summaryLength', summaryLength.value);
        try {
          const res = await fetch('http://localhost:8000/api/summarize', { method: 'POST', body: fd });
          if (!res.ok) { uploadStatus.textContent = 'Summarize failed: ' + await res.text(); return }
          const j = await res.json();
          renderResult(j);
          uploadStatus.textContent = 'Summary generated.';
        } catch (e) { uploadStatus.textContent = 'Summarize failed: ' + e }
      });

      function renderResult(j){
        resultArea.innerHTML = '';
        const sDiv = document.createElement('div'); sDiv.className = 'card';
        const h = document.createElement('h3'); h.textContent = 'Summary'; sDiv.appendChild(h);
        const p = document.createElement('p'); p.textContent = j.summary || ''; sDiv.appendChild(p);
        const kp = document.createElement('div'); kp.style.marginTop = '8px'; kp.innerHTML = '<strong>Key Points</strong>';
        const ul = document.createElement('ul'); ul.style.marginTop='6px'; (j.keyPoints||[]).forEach(k=>{ const li=document.createElement('li'); li.textContent=k; ul.appendChild(li)});
        kp.appendChild(ul); sDiv.appendChild(kp);
        const mi = document.createElement('div'); mi.style.marginTop='8px'; mi.innerHTML = '<strong>Main Ideas</strong>';
        const chips = document.createElement('div'); (j.mainIdeas||[]).forEach(m=>{ const sp=document.createElement('span'); sp.className='chip'; sp.textContent=m; chips.appendChild(sp)});
        mi.appendChild(chips); sDiv.appendChild(mi);
        resultArea.appendChild(sDiv);
      }
    </script>

  </body>
</html>
